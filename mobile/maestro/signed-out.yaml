# What someone not signed in meets before any account, App Review first:
# Account, its sign-in button, the forgotten-password page and sign-up, opened
# the way a person opens them. Each is waited for by something only it shows
# and checked for the error states (checks.yaml); nothing is typed or sent, and
# nothing is captured for the store. Runs after screens.yaml, where the tabs
# are on screen, in the store and large-text passes (store.yaml). What is
# tapped is scrolled to the middle first: at the largest text size it starts
# below the fold, and stopped at the bottom edge it would sit under the tab bar.
appId: net.brokersconnect.app
---
- tapOn: "حسابي"
- extendedWaitUntil:
    visible: "سجّل الدخول إلى حسابك"
    timeout: 30000
- runFlow: checks.yaml

# The sign-in sheet, from the Account card's own button.
- scrollUntilVisible:
    element: "تسجيل الدخول"
    centerElement: true
- tapOn: "تسجيل الدخول"
- extendedWaitUntil:
    visible: "مرحباً بعودتك"
    timeout: 30000
- waitForAnimationToEnd
- runFlow: checks.yaml

# With a one-tap way offered, the email and password wait behind their own
# button: opened as a person opens them.
- runFlow:
    when:
      visible: "المتابعة بالبريد الإلكتروني"
    commands:
      - tapOn: "المتابعة بالبريد الإلكتروني"

# The forgotten-password page, from the link under the password.
- scrollUntilVisible:
    element: "نسيت كلمة المرور؟"
    centerElement: true
- tapOn: "نسيت كلمة المرور؟"
- extendedWaitUntil:
    visible: "اكتب بريدك وسنرسل لك رابطاً لتعيين كلمة مرور جديدة."
    timeout: 30000
- waitForAnimationToEnd
- runFlow: checks.yaml

# Sign-up, by link: the sheet's "create an account" is a link inside a
# sentence, which the accessibility tree does not offer on its own.
- openLink: brokersconnect:///sign-up
- runFlow: confirm-link.yaml
- extendedWaitUntil:
    visible: "أنشئ حسابك"
    timeout: 30000
- scrollUntilVisible:
    element: "تأكيد كلمة المرور"
    centerElement: true
- runFlow: checks.yaml
