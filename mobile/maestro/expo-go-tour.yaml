# Goes through what was added lately the way a reader does, in Expo Go, from
# the board (scripts/expo-go-look.sh): the order's menu, the filter sheet, a
# listing and its Share, back, a company. Every step may find nothing to tap
# (an empty board, a slow answer); what the tour is for is whether Expo Go is
# still standing at the end of it, and what it logged on the way.
appId: host.exp.Exponent
---
- tapOn:
    text: "الأحدث"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "الأعلى راتباً"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "الفلاتر.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "إغلاق"
    optional: true
- waitForAnimationToEnd
# The first listing on the board.
- tapOn:
    point: "50%,52%"
- waitForAnimationToEnd
- tapOn:
    text: "مشاركة"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "إلغاء|Cancel"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "header-back"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "الشركات"
    optional: true
- waitForAnimationToEnd
- tapOn:
    point: "50%,45%"
- waitForAnimationToEnd
- tapOn:
    id: "header-back"
    optional: true
- waitForAnimationToEnd
