# The screens the App Store listing shows, each opened by a link the way a
# shared link or a notification opens it, checked, then captured. The live
# site supplies what they show: scripts/store-screens.sh passes its first
# listing and first company (JOB_SLUG, COMPANY_SLUG) and their names as
# patterns (JOB_TITLE, COMPANY_NAME), or "none" when it lists none. Each screen
# is waited for by something only it shows, so a capture never catches the
# screen before; an empty board and an empty company list are checked as
# such, and the pages they would lead to are left out.
appId: net.brokersconnect.app
---
# Home, as the app opens on it.
- runFlow: checks.yaml
- takeScreenshot: 1-home

# The board: its filter button, then the listing among the cards, or the
# board saying it has none.
- openLink: brokersconnect:///jobs
- runFlow: confirm-link.yaml
- extendedWaitUntil:
    visible: "الفلاتر.*"
    timeout: 45000
- runFlow:
    when:
      true: ${JOB_SLUG != 'none'}
    commands:
      - extendedWaitUntil:
          visible: ".*${JOB_TITLE}.*"
          timeout: 45000
- runFlow:
    when:
      true: ${JOB_SLUG == 'none'}
    commands:
      - extendedWaitUntil:
          visible: "مفيش وظائف مطابقة لبحثك."
          timeout: 45000
- waitForAnimationToEnd
- runFlow: checks.yaml
- takeScreenshot: 2-jobs

- runFlow:
    when:
      true: ${JOB_SLUG != 'none'}
    file: listing.yaml

# The companies: the line under the title and the company among them, or the
# list saying it has none.
- openLink: brokersconnect:///companies
- runFlow: confirm-link.yaml
- runFlow:
    when:
      true: ${COMPANY_SLUG != 'none'}
    commands:
      - extendedWaitUntil:
          visible: "الشركات اللي بتوظّف على بروكرز كونكت، والموثّق منها."
          timeout: 45000
      - extendedWaitUntil:
          visible: ".*${COMPANY_NAME}.*"
          timeout: 45000
- runFlow:
    when:
      true: ${COMPANY_SLUG == 'none'}
    commands:
      - extendedWaitUntil:
          visible: "مفيش شركات مطابقة."
          timeout: 45000
- waitForAnimationToEnd
- runFlow: checks.yaml
- takeScreenshot: 4-companies

- runFlow:
    when:
      true: ${COMPANY_SLUG != 'none'}
    file: company.yaml
