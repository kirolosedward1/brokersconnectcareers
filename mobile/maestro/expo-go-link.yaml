# Opens LINK — the newest update on the channel just published (EXPO_GO_CHANNEL,
# or expo-go) — in Expo Go as
# from outside it, and answers when iOS asks first ("Open in …?").
# scripts/expo-go-look.sh opens its screens with this and reads them itself.
appId: host.exp.Exponent
---
- openLink: ${LINK}
# The question takes a moment to appear.
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "فتح|Open"
    commands:
      - tapOn: "فتح|Open"
