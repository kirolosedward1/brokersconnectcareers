# The Expo app is its own pnpm root, separate from the website's install at the
# repository root (whose pnpm-workspace.yaml lists only itself).
#
# Hoisted, not pnpm's default isolated layout: React Native's autolinking and
# Metro both expect one flat node_modules, and the app pins single copies of
# React and zod that shared website code must resolve to.
nodeLinker: hoisted

packages:
  - '.'

# Build-script approvals, as at the root: both ship prebuilt binaries and only
# fall back to compiling, which is harmless. onlyBuiltDependencies is pnpm 10's
# list (CI's); allowBuilds is pnpm 11's and later, which fail the install
# (ERR_PNPM_IGNORED_BUILDS) on any build script not approved here.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - unrs-resolver

allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true

# No package younger than a day. pnpm 12 applies this by default and refuses a
# lockfile holding one (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION); written here,
# pnpm 10 resolves the same way, so `npx expo install` never records a version
# that a newer pnpm then rejects.
minimumReleaseAge: 1440

# Lift two tooling packages off versions with published advisories, as the
# website does (../pnpm-workspace.yaml). Both arrive through the development
# toolchain, not the app's bundle: shell-quote through React Native's
# devtools (quote() command injection, GHSA reported critical, fixed in
# 1.11.0), source-map-js through Expo's Metro config and postcss (an
# event-loop denial of service, GHSA-68fv-2mgg-jv7q, fixed in 1.2.2). Each is
# a minor or patch release inside the range its dependents ask for.
#
# And fast-uri, which ajv parses $id and $ref URIs with, reached through
# @hookform/resolvers: before 3.1.9, four advisories (scheme spoofing by a
# percent-encoded scheme, host confusion, path equivalence, scheme
# injection; moderate and low). The app's schemas are its own and carry no
# remote $ref, so the exposure is narrow; the fix is a patch release.
overrides:
  fast-uri: '^3.1.9'
  shell-quote: '^1.11.0'
  source-map-js: '^1.2.2'

# Advisories `pnpm audit --audit-level high` (CI's security gate) is told to
# pass over, each with the reason it does not apply. Anything not listed here
# fails the gate.
#
# GHSA-mrhx-c7xc-m3w5, zod (high): see ../pnpm-workspace.yaml; every z.array
# in the app and the shared code is bounded.
# GHSA-86w9-cpqp-85rv, node-forge (high): RSA PKCS#1 v1.5 signature checks,
# inside the Expo CLI (expo > @expo/cli), which runs on the build machine and
# never ships in the app. No fixed release exists yet.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-86w9-cpqp-85rv
