<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التقديم على الوظيفة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#121620}
a{color:#16295A;text-decoration:none}a:hover{color:#0E1D44}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;text-align:right}
.fact .num,.stat .num,[style*="text-align:center"] .num,[style*="align-items:center"]>.num{text-align:center}
.card{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(18,22,32,.04),0 6px 20px rgba(18,22,32,.06)}
label.l{font-size:13px;font-weight:600;color:#121620}
.hint{font-size:12px;line-height:17px;color:#5C6270}
.field{height:50px;padding:0 14px;border:1px solid #E6E1D8;border-radius:14px;background:#fff;font:inherit;font-size:15px;color:#121620;box-sizing:border-box;width:100%}
</style>
</helmet>
<div dir="rtl" lang="ar" style="width:390px;height:844px;box-sizing:border-box;background:#F6F4F0;position:relative;overflow:hidden;display:flex;flex-direction:column">

  <div style="padding:54px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="JobDetail.dc.html" aria-label="رجوع" style="width:44px;height:44px;border-radius:999px;background:#fff;border:1px solid #E6E1D8;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#16295A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <h1 style="margin:0;font-size:18px;line-height:26px;font-weight:700">قدّم على الوظيفة</h1>
      <span style="font-size:12px;color:#5C6270">استشاري مبيعات عقارية · ماونتن فيو</span>
    </div>
  </div>

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:20px;flex:1;overflow:hidden">

    <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:999px;background:#16295A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0"><svg viewBox="0 0 24 24" width="58%" height="58%" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5a.5.5 0 0 1-.5.5h-15a.5.5 0 0 1-.5-.5z"/></svg></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
        <strong style="font-size:15px;font-weight:600">كيرلس إدوارد</strong>
        <span class="hint">ريسيل · <span class="num">4</span> سنوات · القاهرة الجديدة</span>
      </div>
      <a href="Profile.dc.html" style="font-size:13px;font-weight:500">تعديل الملف</a>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label class="l" for="cv">السيرة الذاتية <span style="font-weight:400;color:#5C6270">(آخر ما استخدمته)</span></label>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label for="cv" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid #16295A;border-radius:14px;background:#fff;cursor:pointer">
          <input id="cv" type="radio" name="cv" checked style="accent-color:#16295A;width:20px;height:20px;margin:0">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#16295A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:14px;font-weight:500">Kirolos-CV-2026.pdf</span><span class="hint">رُفعت من أسبوع · <span class="num">240</span> ك.ب</span></span>
        </label>
        <label for="cv2" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px dashed #8B8578;border-radius:14px;background:transparent;cursor:pointer">
          <input id="cv2" type="radio" name="cv" style="accent-color:#16295A;width:20px;height:20px;margin:0">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5C6270" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
          <span style="flex:1;font-size:14px;color:#5C6270">ارفع سيرة ذاتية جديدة (PDF حتى <span class="num">5</span> م.ب)</span>
        </label>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label class="l" for="note">كلمة للشركة <span style="font-weight:400;color:#5C6270">(اختياري)</span></label>
      <textarea id="note" rows="4" placeholder="مثال: أتممت 14 صفقة أوف بلان في 2025، أغلبها في التجمع الخامس." style="padding:12px 14px;border:1px solid #E6E1D8;border-radius:14px;background:#fff;font:inherit;font-size:15px;line-height:24px;resize:none;box-sizing:border-box;width:100%"></textarea>
      <span class="hint" style="text-align:left"><span class="num">0</span> / <span class="num">600</span></span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label class="l" for="wa">رقم واتساب للرد</label>
      <input id="wa" class="field num" type="tel" value="+20 100 123 4567" style="direction:ltr;text-align:left">
      <span class="hint">لا يظهر في دليل الاستشاريين.</span>
    </div>

    <label for="consent" style="display:flex;align-items:flex-start;gap:12px;cursor:pointer">
      <input id="consent" type="checkbox" checked style="accent-color:#16295A;width:20px;height:20px;margin:2px 0 0">
      <span style="font-size:13px;line-height:20px;color:#2B303B">تُشارك سيرتك ورقمك مع ماونتن فيو لهذا الطلب فقط.</span>
    </label>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 34px;background:rgba(255,255,255,.94);border-top:1px solid #E6E1D8;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:8px">
    <button type="submit" style="height:52px;border-radius:999px;background:#16295A;color:#fff;border:0;font:inherit;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 24px rgba(22,41,90,.25)">أرسل الطلب <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
    <span class="hint" style="text-align:center">بلا رسوم. يمكنك سحب طلبك في أي وقت.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
