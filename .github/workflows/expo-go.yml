# The app for Expo Go, published as an EAS Update, so an iPhone opens the
# newest pushed code from Expo's servers with no computer running
# (docs/mobile.md, "Trying it in Expo Go"): `pnpm run ota expo-go`, which
# publishes on the `expo-go` channel with Expo Go's runtime version and the
# store build's settings (mobile/scripts/publish-update.mjs).
#
# It needs one thing from the owner's Expo account: an access token in the
# repository's secrets as EXPO_TOKEN. Without it, it does nothing. While
# mobile/app.config.ts carries no EAS project id, the publish finds the
# app's project on the token's account, or creates it the first time
# (`eas init`, in scripts/publish-update.mjs), and the summary gives its id
# to write there for builds and pushes.
#
# Runs by hand (Actions → Expo Go → Run workflow, on any branch), on pushes to
# main, and on this repository's own pull requests. Each publish replaces what
# Expo Go opens next: the newest of them wins.
name: Expo Go

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed, shown with the update
        required: false
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'messages/**'
      - '.github/workflows/expo-go.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'messages/**'
      - '.github/workflows/expo-go.yml'

permissions:
  contents: read

concurrency:
  group: expo-go
  cancel-in-progress: true

jobs:
  publish:
    # A fork's pull request gets no secrets; it would only fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Is there an Expo token
        id: token
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No EXPO_TOKEN secret: nothing published. docs/mobile.md, 'Trying it in Expo Go', says how to set it up."
          fi

      - if: steps.token.outputs.present == 'yes'
        uses: actions/checkout@v4

      - if: steps.token.outputs.present == 'yes'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - if: steps.token.outputs.present == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - if: steps.token.outputs.present == 'yes'
        run: pnpm install --frozen-lockfile

      - name: Publish for Expo Go
        if: steps.token.outputs.present == 'yes'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Passed through the environment, never pasted into the script.
          GIVEN: ${{ inputs.message }}
          COMMIT: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          # The publish's own status, not tee's: a failed publish fails the job.
          set -o pipefail
          message="${GIVEN:-${COMMIT:-Expo Go update}}"
          message="$(printf '%s' "$message" | head -n 1 | cut -c 1-200)"
          pnpm run ota expo-go --message "$message (${GITHUB_SHA::7})" --non-interactive 2>&1 | tee "$RUNNER_TEMP/publish.log"
          # One match each, and none is not an error here.
          link=$(grep -m 1 -o 'https://qr.expo.dev/eas-update?[^ ]*' "$RUNNER_TEMP/publish.log" || true)
          dashboard=$(grep -m 1 -o 'https://expo.dev/accounts/[^ ]*/updates/[^ ]*' "$RUNNER_TEMP/publish.log" || true)
          project=$(grep -m 1 -o 'EAS project id: [0-9a-f-]*' "$RUNNER_TEMP/publish.log" | cut -d ' ' -f 4 || true)
          {
            echo "### Open it in Expo Go"
            echo
            echo "In Expo Go on the iPhone, signed in to the Expo account this token belongs to, the app is under Projects. Or scan the QR code on [this page]($link) with the iPhone's camera."
            if [ -n "$dashboard" ]; then
              echo
              echo "The update on Expo's dashboard: $dashboard"
            fi
            if [ -n "$project" ]; then
              echo
              echo "The EAS project's id is \`$project\`. Builds and push notifications need it written in \`mobile/app.config.ts\` in place of \`null\` (\`EAS_PROJECT_ID\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
