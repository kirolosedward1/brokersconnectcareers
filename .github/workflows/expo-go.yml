# The app, published over the air after every push to main — as Vercel
# deploys the website after every push — and for this repository's own pull
# requests, so an iPhone opens the newest pushed code from Expo's servers with
# no computer running (docs/mobile.md, "Trying it in Expo Go" and
# "Over-the-air updates"). `pnpm run ota <channel>`, which publishes with the
# store build's settings (mobile/scripts/publish-update.mjs).
#
# Two channels. `expo-go`, on every run: Expo Go, the App Store app, opens it
# from a link or a QR code, on Expo Go's own runtime. `production`, on pushes
# to main only: the channel a store build of the app listens on, so an
# installed app takes the same code the website runs from its next launch,
# instead of waiting for somebody to remember to publish. A build takes only
# an update whose fingerprint matches its own native code, so while there is
# no build this reaches nobody, and after a native change it reaches the
# builds made since (docs/mobile.md, "Over-the-air updates").
#
# Before anything is published the app's own checks run (pnpm check). A
# publish ships whatever was pushed, and a bundle that failed its tests
# reached the phone before the Mobile workflow had finished saying so.
#
# And on main the publish waits for the website. The update and the Vercel
# deployment of the same push start together and each takes a few minutes, so
# a phone could take the app's new code before the API it calls was there. The
# website says which commit it serves (/api/mobile/v1/config, `commit`); the
# publish waits until that commit carries every change outside mobile/ that
# this push does — the inverse of vercel.json's ignoreCommand, which skips the
# deployment for a change under mobile/ alone — and gives up, failing, after
# twenty minutes: a website that did not deploy is not one to publish an app
# against.
#
# It needs one thing from the owner's Expo account (kirolosedward1, which
# owns the EAS project mobile/app.config.ts names): a personal access token
# in the repository's secrets as EXPO_TOKEN. Without it, it does nothing. A
# fork whose app.config.ts carries no project id has the publish find or
# create one on the token's account (`eas init`, in
# scripts/publish-update.mjs), and the summary gives its id.
#
# Runs by hand (Actions → Over the air → Run workflow, on any branch), on
# pushes to main, and on this repository's own pull requests. A channel holds
# one newest update, so pushes to main and runs by hand publish on `expo-go`,
# the channel the owner's phone opens, and each pull request on its own
# (`expo-go-pr-<number>`, EXPO_GO_CHANNEL below), with its own link in the
# run's summary: a branch never replaces what main's link opens, nor is it
# replaced by the next branch minutes later. Only main publishes on
# `production`.
name: Over the air

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed, shown with the update
        required: false
      production:
        description: Publish to the production channel too (what an installed app takes)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'messages/**'
      - '.github/workflows/expo-go.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'messages/**'
      - '.github/workflows/expo-go.yml'

permissions:
  contents: read

# One publish at a time per channel: a newer run of the same pull request, or
# of main, cancels the one before it; another branch's does not.
concurrency:
  group: expo-go-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: true

env:
  # The channel this run publishes on and the look job opens (publish-update.mjs).
  EXPO_GO_CHANNEL: ${{ github.event_name == 'pull_request' && format('expo-go-pr-{0}', github.event.number) || 'expo-go' }}

jobs:
  publish:
    # A fork's pull request gets no secrets; it would only fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      published: ${{ steps.token.outputs.present }}
    defaults:
      run:
        working-directory: mobile
    env:
      # The production channel: after every push to main, or when asked for by hand.
      PRODUCTION: ${{ github.event_name == 'push' || inputs.production == true }}
    steps:
      - name: Is there an Expo token
        id: token
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No EXPO_TOKEN secret: nothing published. docs/mobile.md, 'Trying it in Expo Go', says how to set it up."
          fi

      - if: steps.token.outputs.present == 'yes'
        uses: actions/checkout@v4
        with:
          # The whole history: the wait below compares this push with the
          # commit the website serves, which may be several behind.
          fetch-depth: 0

      - if: steps.token.outputs.present == 'yes'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - if: steps.token.outputs.present == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - if: steps.token.outputs.present == 'yes'
        run: pnpm install --frozen-lockfile

      # What the Mobile workflow runs, before any of it reaches a phone:
      # typecheck, lint, the shared-code guard, the publishing check, Jest.
      - name: The app's checks
        if: steps.token.outputs.present == 'yes'
        run: pnpm check
        env:
          # The job's channel is for the publish; the checks test the default
          # channel and would read a pull request's instead (an empty name is no name).
          EXPO_GO_CHANNEL: ''

      - name: Wait for the website to carry this push
        if: steps.token.outputs.present == 'yes' && github.event_name == 'push'
        env:
          # The host a store build talks to, as eas.json has it: the one whose
          # commit matters.
          SITE_URL: ${{ fromJSON(format('"{0}"', 'https://www.brokersconnect.net')) }}
        run: |
          site=$(node -p "require('./eas.json').build.base.env.EXPO_PUBLIC_SITE_URL")
          # The website's content: everything but the app, the workflows and the prose.
          web=(. ':(exclude)mobile' ':(exclude).github' ':(exclude)docs' ':(exclude)*.md')
          deadline=$((SECONDS + 1200))
          while :; do
            # "none" for a website from before it said its commit; "" for no answer.
            served=$(curl -sf --max-time 20 "$site/api/mobile/v1/config" | node -e '
              let d = ""; process.stdin.on("data", (c) => (d += c)).on("end", () => {
                try { const c = JSON.parse(d).commit; process.stdout.write(typeof c === "string" && c ? c : "none"); } catch {}
              });' || true)
            if [ "$served" = "none" ]; then
              echo "::notice::The website does not yet say which commit it serves; publishing without waiting for it."
              break
            fi
            if [ -n "$served" ]; then
              git cat-file -e "$served^{commit}" 2>/dev/null || git fetch --quiet origin "$served" 2>/dev/null || true
              if git cat-file -e "$served^{commit}" 2>/dev/null; then
                if git merge-base --is-ancestor "$GITHUB_SHA" "$served"; then
                  echo "The website serves ${served::7}, at or past this push (${GITHUB_SHA::7})."
                  break
                fi
                if git diff --quiet "$served" "$GITHUB_SHA" -- "${web[@]}"; then
                  echo "The website serves ${served::7}, which has everything of the website this push (${GITHUB_SHA::7}) has."
                  break
                fi
                echo "The website serves ${served::7}; this push is ${GITHUB_SHA::7} and changes the website. Waiting."
              else
                echo "The website serves $served, which this checkout does not have. Waiting."
              fi
            else
              echo "The website did not answer. Waiting."
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::After twenty minutes the website still serves ${served:-nothing}, not this push (${GITHUB_SHA::7}): its deployment failed or is stuck (Vercel). Nothing was published; fix the website and run this workflow again."
              exit 1
            fi
            sleep 20
          done

      - name: Publish for Expo Go
        if: steps.token.outputs.present == 'yes'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Passed through the environment, never pasted into the script.
          GIVEN: ${{ inputs.message }}
          # Characters, not bytes, for the shell's own cut below.
          LC_ALL: C.UTF-8
          COMMIT: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          # The publish's own status, not tee's: a failed publish fails the job.
          set -o pipefail
          message="${GIVEN:-${COMMIT:-Expo Go update}}"
          # Its first line, at most 200 characters, in the shell itself: cut
          # counts bytes and can halve an Arabic letter, and under pipefail a
          # pipe whose reader stops early (head) can fail the step.
          message="${message%%$'\n'*}"
          message="${message:0:200}"
          echo "MESSAGE=$message" >> "$GITHUB_ENV"
          pnpm run ota expo-go --message "$message (${GITHUB_SHA::7})" --non-interactive 2>&1 | tee "$RUNNER_TEMP/publish.log"
          # One match each, and none is not an error here.
          link=$(grep -m 1 -o 'https://qr.expo.dev/eas-update?[^ ]*' "$RUNNER_TEMP/publish.log" || true)
          # The script's own line, not any link eas-cli may print: its link is the channel's, for good.
          phone=$(grep -m 1 -o 'paste into Safari on the phone: exp://u.expo.dev/[^ ]*' "$RUNNER_TEMP/publish.log" | sed 's/^.*: //' || true)
          dashboard=$(grep -m 1 -o 'https://expo.dev/accounts/[^ ]*/updates/[^ ]*' "$RUNNER_TEMP/publish.log" || true)
          project=$(grep -m 1 -o 'EAS project id: [0-9a-f-]*' "$RUNNER_TEMP/publish.log" | cut -d ' ' -f 4 || true)
          {
            echo "### Open it in Expo Go"
            echo
            echo "Published on the \`$EXPO_GO_CHANNEL\` channel. Scan the QR code on [this page]($link) with the iPhone's camera, or paste this into Safari on the phone (signed in to the Expo account this token belongs to in Expo Go):"
            echo
            echo "    $phone"
            echo
            if [ "$EXPO_GO_CHANNEL" != "expo-go" ]; then
              echo "This is a pull request's own channel: the \`expo-go\` link the phone already has keeps opening main. Each push to this pull request replaces what this link opens."
            fi
            if [ -n "$dashboard" ]; then
              echo
              echo "The update on Expo's dashboard: $dashboard"
            fi
            if [ -n "$project" ]; then
              echo
              echo "The EAS project's id is \`$project\`. Builds and push notifications need it written in \`mobile/app.config.ts\` in place of \`null\` (\`EAS_PROJECT_ID\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The same code for a store build of the app, on its own channel. Nothing
      # takes it until there is a build; from then on every push to main
      # reaches installed phones from their next launch, as it reaches the
      # website at once.
      - name: Publish for the installed app
        if: steps.token.outputs.present == 'yes' && env.PRODUCTION == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          pnpm run ota production --message "$MESSAGE (${GITHUB_SHA::7})" --non-interactive 2>&1 | tee "$RUNNER_TEMP/publish-production.log"
          dashboard=$(grep -m 1 -o 'https://expo.dev/accounts/[^ ]*/updates/[^ ]*' "$RUNNER_TEMP/publish-production.log" || true)
          {
            echo
            echo "### The installed app"
            echo
            echo "Published on the \`production\` channel too: a store build takes it from its next launch (none exists yet: docs/app-store.md)."
            if [ -n "$dashboard" ]; then
              echo
              echo "On Expo's dashboard: $dashboard"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  look:
    # What was just published, opened in Expo Go on an iPhone simulator as the
    # owner's phone opens it — from Expo's servers, in English, then again from
    # Expo Go's own home — and read back: the run's annotations say where every
    # line sat on each screen, and a tab bar laid out left to right fails it
    # (mobile/scripts/expo-go-look.sh).
    needs: publish
    if: needs.publish.outputs.published == 'yes'
    # Xcode 26, as for the native build in mobile.yml.
    runs-on: macos-26
    timeout-minutes: 60
    # One simulator at a time, whichever channel: the Mac runner is the
    # expensive one, and the newest publish anywhere is the one worth looking at.
    concurrency:
      group: expo-go-look
      cancel-in-progress: true
    defaults:
      run:
        working-directory: mobile
    env:
      # Pinned as in ios-screens.yml.
      MAESTRO_VERSION: 2.6.0
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4

      # Maestro runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Open it in Expo Go
        run: scripts/expo-go-look.sh "$RUNNER_TEMP/expo-go"

      - name: Keep the screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-go-screens
          path: ${{ runner.temp }}/expo-go
          if-no-files-found: warn
          retention-days: 14
