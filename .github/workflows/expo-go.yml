# The app for Expo Go, published as an EAS Update, so an iPhone opens the
# newest pushed code from Expo's servers with no computer running
# (docs/mobile.md, "Trying it in Expo Go"): `pnpm run ota expo-go`, which
# publishes on the `expo-go` channel with Expo Go's runtime version and the
# store build's settings (mobile/scripts/publish-update.mjs).
#
# It needs the owner's Expo account: an access token in the repository's
# secrets as EXPO_TOKEN, and the EAS project's id in mobile/app.config.ts.
# Without the token it does nothing; with the token and no project, it fails
# and says what is missing.
#
# Runs by hand (Actions → Expo Go → Run workflow, on any branch), on pushes to
# main, and on this repository's own pull requests. Each publish replaces what
# Expo Go opens next: the newest of them wins.
name: Expo Go

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed, shown with the update
        required: false
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'messages/**'
      - '.github/workflows/expo-go.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'messages/**'
      - '.github/workflows/expo-go.yml'

permissions:
  contents: read

concurrency:
  group: expo-go
  cancel-in-progress: true

jobs:
  publish:
    # A fork's pull request gets no secrets; it would only fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Is there an Expo token
        id: token
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No EXPO_TOKEN secret: nothing published. docs/mobile.md, 'Trying it in Expo Go', says how to set it up."
          fi

      - if: steps.token.outputs.present == 'yes'
        uses: actions/checkout@v4

      - if: steps.token.outputs.present == 'yes'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - if: steps.token.outputs.present == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - if: steps.token.outputs.present == 'yes'
        run: pnpm install --frozen-lockfile

      - name: Publish for Expo Go
        if: steps.token.outputs.present == 'yes'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Passed through the environment, never pasted into the script.
          GIVEN: ${{ inputs.message }}
          COMMIT: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          message="${GIVEN:-${COMMIT:-Expo Go update}}"
          message="$(printf '%s' "$message" | head -n 1 | cut -c 1-200)"
          pnpm run ota expo-go --message "$message (${GITHUB_SHA::7})" --non-interactive | tee "$RUNNER_TEMP/publish.log"
          link=$(grep -o 'https://qr.expo.dev/eas-update?[^ ]*' "$RUNNER_TEMP/publish.log" | head -n 1)
          {
            echo "### Open it in Expo Go"
            echo
            echo "Scan the QR code on [this page]($link) with the iPhone's camera, signed in to the same Expo account in Expo Go."
          } >> "$GITHUB_STEP_SUMMARY"
