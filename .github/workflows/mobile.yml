# The iOS app's checks (mobile/), on every pull request and push to main that
# touches the app or the website code it bundles.
#
# The app imports the website's pure modules from src/lib and its message
# catalogues from messages/, so a change there is a change to the app too and
# runs this as well as the web workflow.
#
#   pnpm check      typecheck (app and tests), ESLint, the shared-code guard
#                   (scripts/check-shared.mjs), the update-publishing check
#                   (scripts/publish-update.test.mjs) and the Jest suites
#   export:ios      bundles the app for iOS with Metro and Hermes, which is
#                   what an EAS build does first: an import Metro cannot
#                   resolve, or a module Hermes cannot compile, fails here
#   expo install    the dependency versions the installed SDK expects
#   expo-doctor     Expo's own check of the config and the native setup
#
# The native iOS build (prebuild + xcodebuild on macOS) is slower and runs on
# main and by hand, not on every pull request.
#
# The EXPO_PUBLIC_* values are the public, client-side ones in eas.json. No
# secrets are used; the repository is public.
name: Mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'messages/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'messages/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: https://hiwdhicwsohbipxzazmb.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ghKaq9WMTXgn01IEJuh-EA_LEa9Nlry
  EXPO_PUBLIC_SITE_URL: https://www.brokersconnect.net

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Bundle for iOS
        run: pnpm export:ios

      # Against the SDK the lockfile installs, not the newest patches: doctor's
      # own version check asks Expo's servers, so it went red each time Expo
      # published an SDK patch, and could not be fixed for a day because pnpm
      # here takes nothing younger (pnpm-workspace.yaml, minimumReleaseAge).
      # On main that also skipped the iOS build, which waits on this job.
      # Newer patches are taken on purpose: npx expo install --fix.
      - name: Dependency versions
        run: npx expo install --check
        env:
          EXPO_OFFLINE: '1'

      - name: Expo doctor
        run: npx expo-doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'

  ios-build:
    # A real native build for the simulator: config plugins, CocoaPods, Swift
    # and Objective-C all compile. Not on pull requests (it takes a while and
    # needs a macOS runner); on main, and on demand.
    #
    # Xcode 26, as EAS builds SDK 57 with. On macos-15 (Xcode 16.4, Swift 6.1)
    # the build failed in ExpoModulesJSI's "Build xcframework" phase: its Swift
    # package says swift-tools-version 6.2, which only Xcode 26 reads. @expo/ui,
    # which expo-router depends on, also calls iOS 26 SwiftUI API
    # (ButtonRole.close) that Xcode 16's SDK does not have. macos-26 defaults to
    # Xcode 26.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Xcode
        run: |
          xcodebuild -version
          if ! xcodebuild -version | grep -qE '^Xcode (2[6-9]|[3-9][0-9])\.'; then
            echo "::error::Expo SDK 57 needs Xcode 26 or later"
            exit 1
          fi

      - name: Generate the native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        run: pod install
        working-directory: mobile/ios

      # The whole log is kept and only its errors are shown when it fails: the
      # compiler's errors come long before the end, where a tail would miss them.
      - name: Build for the simulator
        working-directory: mobile/ios
        run: |
          if xcodebuild \
            -workspace BrokersConnect.xcworkspace \
            -scheme BrokersConnect \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/xcodebuild.log"
          else
            grep -nE -A4 'error:|fatal error|Undefined symbol|The following build commands failed' "$RUNNER_TEMP/xcodebuild.log" | head -n 300 || true
            tail -n 40 "$RUNNER_TEMP/xcodebuild.log"
            exit 1
          fi
