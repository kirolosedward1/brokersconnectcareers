# The iOS app's checks (mobile/), on every pull request and push to main that
# touches the app or the website code it bundles.
#
# The app imports the website's pure modules from src/lib and its message
# catalogues from messages/, so a change there is a change to the app too and
# runs this as well as the web workflow.
#
#   pnpm check      typecheck (app and tests), ESLint, the shared-code guard
#                   (scripts/check-shared.mjs), the update-publishing check
#                   (scripts/publish-update.test.mjs) and the Jest suites
#   export:ios      bundles the app for iOS with Metro and Hermes, which is
#                   what an EAS build does first: an import Metro cannot
#                   resolve, or a module Hermes cannot compile, fails here
#   release:check   the production profile, the evaluated app.config.ts and
#                   the exported bundle, as a store build takes them
#                   (scripts/release-check.mjs)
#   expo install    the dependency versions the installed SDK expects
#   expo-doctor     Expo's own check of the config and the native setup
#   contract        every database request the app's tests make, replayed
#                   against a real Postgres built from the migrations behind a
#                   real PostgREST (scripts/contract/replay.mjs): a column, an
#                   embed, an RPC's arguments or a grant the fixtures answer
#                   but the real schema refuses fails here
#   website         the website's own checks that read the app's files
#                   (scripts/messages.mjs, legal.test.mjs, app-links.test.mjs,
#                   route-parity.test.mjs): the Web workflow skips a change
#                   made only under mobile/, so they run here too, or a
#                   mobile-only merge turned main's web check red for the next
#                   person to push
#
# The native iOS build (prebuild + xcodebuild on macOS) is slower and runs on
# main and by hand, not on every pull request.
#
# The paths below are everything the app is made of, on both sides of the
# repository: its own code; the website's shared modules and catalogues; the
# migrations its direct reads run against; the API routes it calls
# (src/app/api/mobile, and the CV, agent-CV and export routes it opens); the
# website's pages, whose set the route-parity check holds the app's screens
# to; the brand files tests/brand.test.ts holds byte for byte; and the
# website scripts the checks here run.
#
# The EXPO_PUBLIC_* values are the public, client-side ones in eas.json. No
# secrets are used; the repository is public.
name: Mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'src/app/api/**'
      - 'src/app/.well-known/**'
      - 'src/app/[locale]/**/page.tsx'
      - 'messages/**'
      - 'public/brand/**'
      - 'public/illustrations/**'
      - 'public/media/hero-poster.jpg'
      - 'supabase/migrations/**'
      - 'supabase/seed*.sql'
      - 'supabase/tests/setup.mjs'
      - 'scripts/contract/**'
      - 'scripts/messages.mjs'
      - 'scripts/legal.test.mjs'
      - 'scripts/app-links.test.mjs'
      - 'scripts/route-parity.test.mjs'
      - 'scripts/licenses.mjs'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'src/app/api/**'
      - 'src/app/.well-known/**'
      - 'src/app/[locale]/**/page.tsx'
      - 'messages/**'
      - 'public/brand/**'
      - 'public/illustrations/**'
      - 'public/media/hero-poster.jpg'
      - 'supabase/migrations/**'
      - 'supabase/seed*.sql'
      - 'supabase/tests/setup.mjs'
      - 'scripts/contract/**'
      - 'scripts/messages.mjs'
      - 'scripts/legal.test.mjs'
      - 'scripts/app-links.test.mjs'
      - 'scripts/route-parity.test.mjs'
      - 'scripts/licenses.mjs'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: https://hiwdhicwsohbipxzazmb.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ghKaq9WMTXgn01IEJuh-EA_LEa9Nlry
  EXPO_PUBLIC_SITE_URL: https://www.brokersconnect.net

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Bundle for iOS
        run: pnpm export:ios

      # What a store build is made from — the production profile, the
      # evaluated app.config.ts, the listing's version, the icons — and the
      # bundle just exported, which must hold no secret key or token.
      - name: Release check
        run: pnpm release:check --bundle dist

      # Against the SDK the lockfile installs, not the newest patches: doctor's
      # own version check asks Expo's servers, so it went red each time Expo
      # published an SDK patch, and could not be fixed for a day because pnpm
      # here takes nothing younger (pnpm-workspace.yaml, minimumReleaseAge).
      # On main that also skipped the iOS build, which waits on this job.
      # Newer patches are taken on purpose: npx expo install --fix.
      - name: Dependency versions
        run: npx expo install --check
        env:
          EXPO_OFFLINE: '1'

      - name: Expo doctor
        run: npx expo-doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'

  website:
    # The website's checks that read the app. Four of `pnpm check`'s scripts
    # open files under mobile/: the catalogue scan counts a key the app alone
    # asks for as used (scripts/messages.mjs), the legal test holds the
    # Account tab and onboarding to the documents (scripts/legal.test.mjs),
    # the app-links test holds app.config.ts's Android paths to the iOS file
    # (scripts/app-links.test.mjs), and the route-parity test holds the app's
    # screens to the website's pages (scripts/route-parity.test.mjs). The Web
    # workflow does not run for a change made only under mobile/, so without
    # this a key the app stopped using, or a screen it dropped, went red on
    # main at the next unrelated push to the website.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The catalogue, as the app reads it
        run: pnpm test:messages

      - name: The legal documents, as the app links them
        run: pnpm test:legal

      - name: The links that open the app
        run: pnpm test:app-links

      - name: Every website page has its place in the app
        run: pnpm test:route-parity

  contract:
    # The app's tests answer Supabase from fixtures; here every distinct
    # request they made goes to the real thing. The runner's own Postgres 16
    # binaries hold the database; PostgREST is release 12, pinned by digest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install (website, for the database scripts; and app)
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir mobile install --frozen-lockfile

      - name: Record the requests the app's tests make
        working-directory: mobile
        run: RECORD_REQUESTS="$RUNNER_TEMP/requests.jsonl" npx jest

      - name: PostgREST
        run: |
          curl -sSfL -o "$RUNNER_TEMP/postgrest.tar.xz" \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.12/postgrest-v12.2.12-linux-static-x86-64.tar.xz
          echo "5de4092f1719da3353c40bf96c8dec6913f2254a7cd0b61cc05f233153b557d5  $RUNNER_TEMP/postgrest.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP"

      - name: Replay them against the migrations and PostgREST
        run: POSTGREST_BIN="$RUNNER_TEMP/postgrest" node scripts/contract/replay.mjs "$RUNNER_TEMP/requests.jsonl"

  ios-build:
    # A real native build for the simulator: config plugins, CocoaPods, Swift
    # and Objective-C all compile. Not on pull requests (it takes a while and
    # needs a macOS runner); on main, and on demand.
    #
    # Xcode 26, as EAS builds SDK 58 with. On macos-15 (Xcode 16.4, Swift 6.1)
    # the build failed in ExpoModulesJSI's "Build xcframework" phase: its Swift
    # package says swift-tools-version 6.2, which only Xcode 26 reads. @expo/ui,
    # which expo-router depends on, also calls iOS 26 SwiftUI API
    # (ButtonRole.close) that Xcode 16's SDK does not have. macos-26 defaults to
    # Xcode 26.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Xcode
        run: |
          xcodebuild -version
          if ! xcodebuild -version | grep -qE '^Xcode (2[6-9]|[3-9][0-9])\.'; then
            echo "::error::Expo SDK 58 needs Xcode 26 or later"
            exit 1
          fi

      - name: Generate the native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        run: pod install
        working-directory: mobile/ios

      # The whole log is kept and only its errors are shown when it fails: the
      # compiler's errors come long before the end, where a tail would miss them.
      - name: Build for the simulator
        working-directory: mobile/ios
        run: |
          if xcodebuild \
            -workspace BrokersConnect.xcworkspace \
            -scheme BrokersConnect \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/xcodebuild.log"
          else
            grep -nE -A4 'error:|fatal error|Undefined symbol|The following build commands failed' "$RUNNER_TEMP/xcodebuild.log" | head -n 300 || true
            tail -n 40 "$RUNNER_TEMP/xcodebuild.log"
            exit 1
          fi
