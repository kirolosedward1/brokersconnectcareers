# Security gates on every pull request, every push to main, and weekly (an
# advisory published on a quiet week still turns this red).
#
#   secrets   gitleaks over the whole history, every branch. Findings already
#             reviewed as fixtures are in .github/gitleaks-baseline.json; the
#             publishable Supabase key is allowed by .gitleaks.toml. Anything
#             else fails. The report is redacted: a finding names the commit,
#             the file and the rule, never the value — this log is public.
#   audit     pnpm audit at high and above, for the website and the app, each
#             against its own lockfile. Exceptions are named one by one, with
#             the reason, under auditConfig in each pnpm-workspace.yaml.
#   codeql    GitHub's JavaScript/TypeScript analysis, results in the
#             repository's Security tab.
#
# The client-bundle scans (no server secret in what ships to browsers and
# phones) run where the bundles are built: web.yml after `pnpm build`,
# mobile.yml after `expo export`.
#
# No secrets are used, and no job here runs code from a fork with a token that
# can write: pull requests get contents: read (codeql adds security-events:
# write, which only uploads its own results). The repository is public.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The binary, not gitleaks-action: one pinned release, checked against
      # the checksum its release publishes, and nothing else to trust.
      - name: Install gitleaks 8.28.0
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tgz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Scan every commit on every branch
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          /tmp/gitleaks git --config .gitleaks.toml \
            --baseline-path .github/gitleaks-baseline.json \
            --log-opts='--all' --redact --exit-code 1 .

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      # pnpm audit reads the lockfile; nothing is installed or run.
      - name: Website dependencies
        run: pnpm audit --audit-level high

      - name: App dependencies
        working-directory: mobile
        run: pnpm audit --audit-level high

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: /language:javascript-typescript
