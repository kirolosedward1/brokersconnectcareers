project_id = "real-estate-jobs-eg"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only. The hosted project has mailer_autoconfirm off, so a real signup
# does require the confirmation email — which is why the templates below and
# the SMTP block matter.
enable_confirmations = false
secure_password_change = true
# One email per address per minute, whatever asked for it. GoTrue enforces
# this itself, in front of the app's own per-address and per-IP counters
# (src/lib/actions/auth-email.ts).
max_frequency = "60s"
# Every emailed link or code — confirmation, reset, email change, magic link —
# expires after an hour and works once. The templates say "an hour", so this
# and the hosted setting (Authentication -> Providers -> Email -> Email OTP
# Expiration) must not be raised without regenerating them.
otp_expiry = 3600

# Generated by `pnpm auth:templates` from the same components and copy as every
# other email this platform sends. Do not edit these files by hand: the next
# run overwrites them, and hand-edits in the Supabase dashboard drift silently
# from the design everything else uses.
#
# The hosted project does not read this file. After regenerating, paste each
# one into Authentication -> Emails -> Templates. The script prints the subject
# line that goes with each.
[auth.email.template.confirmation]
subject = "أكّد بريدك الإلكتروني في بروكرز كونكت"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "إعادة تعيين كلمة المرور"
content_path = "./templates/recovery.html"

[auth.email.template.email_change]
subject = "أكّد بريدك الإلكتروني الجديد"
content_path = "./templates/email-change.html"

[auth.email.template.reauthentication]
subject = "كود تأكيد الهوية"
content_path = "./templates/reauthentication.html"

[auth.email.template.magic_link]
subject = "لينك الدخول لحسابك"
content_path = "./templates/magic-link.html"

# Auth mail does not go through the application's Resend integration — GoTrue
# sends it, over SMTP. Supabase's built-in sender is rate limited to a handful
# of messages an hour and is documented as not for production, so without this
# the one email every account depends on is the least reliable thing on the
# platform.
#
# Same verified domain and same sender as everything else, so all mail from
# Brokers Connect aligns for DMARC.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@brokersconnect.net"
sender_name = "Brokers Connect"

# Project-wide ceilings, per hour. With custom SMTP these are ours to set, and
# the hosted project must be set to match in Authentication -> Rate Limits:
# they are the backstop if the app-side counters are ever bypassed by calling
# GoTrue directly with the public anon key, which anyone can.
[auth.rate_limit]
email_sent = 60
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

# Phone OTP is explicitly out of scope for v1 — it needs a paid SMS provider.
# WhatsApp number is captured as a required profile field at onboarding instead.
[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
