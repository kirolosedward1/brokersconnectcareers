project_id = "real-estate-jobs-eg"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only. The hosted project has mailer_autoconfirm off, so a real signup
# does require the confirmation email — which is why the templates below and
# the SMTP block matter.
enable_confirmations = false
secure_password_change = true
# One email per address per minute, whatever asked for it. GoTrue enforces
# this itself, in front of the app's own per-address and per-IP counters
# (src/lib/actions/auth-email.ts).
max_frequency = "60s"
# Links and codes expire after one hour, on this stack and on the hosted
# project (Email OTP Expiration 3600). Every auth template says one hour.
# Raise this value only together with that copy.
otp_expiry = 3600

# Generated by `pnpm auth:templates` from the same components and copy as every
# other email this platform sends. Do not edit these files by hand: the next
# run overwrites them, and hand-edits in the Supabase dashboard drift silently
# from the design everything else uses.
#
# The hosted project does not read this file. After regenerating, paste each
# one into Authentication -> Emails -> Templates. The script prints the subject
# line that goes with each.
[auth.email.template.confirmation]
subject = "أكّد بريدك الإلكتروني في بروكرز كونكت"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "إعادة تعيين كلمة المرور"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "أكّد بريدك الإلكتروني الجديد"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.reauthentication]
subject = "رمز تأكيد الهوية"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.template.magic_link]
subject = "رابط الدخول إلى حسابك"
content_path = "./supabase/templates/magic-link.html"

# Auth mail does not go through the application's Resend integration — GoTrue
# sends it, over SMTP. Supabase's built-in sender is rate limited to a handful
# of messages an hour and is documented as not for production, so without this
# the one email every account depends on is the least reliable thing on the
# platform.
#
# Same verified domain and same sender as everything else, so all mail from
# Brokers Connect aligns for DMARC.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@brokersconnect.net"
sender_name = "Brokers Connect"

# Project-wide ceilings, per hour. With custom SMTP these are ours to set, and
# the hosted project must be set to match in Authentication -> Rate Limits:
# they are the backstop if the app-side counters are ever bypassed by calling
# GoTrue directly with the public anon key, which anyone can.
[auth.rate_limit]
email_sent = 60
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

# Phone OTP is explicitly out of scope for v1 — it needs a paid SMS provider.
# WhatsApp number is captured as a required profile field at onboarding instead.
# Two-step verification, as production has it (docs/security/SUPABASE_SETTINGS.md).
# The CLI leaves TOTP off by default, and the admin console requires a second
# factor under a production build (requireAdmin), so without this no admin on a
# local stack — or in .github/workflows/e2e.yml — could reach the console.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
# The phone's Google sheet cannot set a nonce GoTrue can check: iOS puts its
# own nonce in the identity token, and the original sign-in module has no way
# to choose it (mobile/src/features/auth/google.ts). The hosted project needs
# the same switch, Authentication → Providers → Google → Skip nonce check.
# The website's One Tap still sends a nonce; with this on, that nonce is not
# verified. Client IDs for the app (web first, then iOS, then Android) are
# set on the hosted provider, comma-separated, not in this file.
skip_nonce_check = true
