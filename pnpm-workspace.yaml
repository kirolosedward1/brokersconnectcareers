# Build-script approvals. Without these, pnpm reports ERR_PNPM_IGNORED_BUILDS —
# a warning on pnpm 10, which is what Vercel currently uses, but an error on
# pnpm 11, where it also fails `pnpm build` via the dependency-status check.
# Recording the decision here keeps installs identical on both.
#
# All three arrive transitively: sharp and @parcel/watcher via next/next-intl,
# @swc/core via the toolchain. None is required for a Vercel build — image
# optimisation is handled by the platform — but building them is harmless and
# keeps a local `pnpm start` able to optimise images too.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - sharp

# Lift postcss off the version Next pins.
#
# `pnpm audit --prod` reports four advisories, all postcss and all reached
# through next, which depends on an exact 8.4.31: two path traversals in
# source-map auto-loading, an arbitrary file read, and an XSS in stringify
# output. They are build-time rather than runtime — every stylesheet this app
# processes comes from its own repository — so the exposure is narrow, and the
# fix is a version number.
#
# 8.5.x is a minor bump within the same major and postcss holds semver
# strictly. Proven by the only thing that can prove it: a full production
# build, which compiles every route's CSS through exactly this dependency.
overrides:
  postcss: '^8.5.23'
